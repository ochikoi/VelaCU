<!doctype html>
<meta charset="utf-8">
<title>VelaCU Zero-Prompt Test</title>
<style>
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f4f4}
  main{height:100%;display:grid;place-items:center}
  button{font-size:42px;font-weight:700;padding:42px 80px;border-radius:24px;border:0;background:#1677ff;color:white;box-shadow:0 8px 30px #0002}
  button.success{background:#28a745}
</style>
<main><button id="target">CLICK ME</button></main>
<script>
const b=document.getElementById('target');
b.addEventListener('click',()=>{b.textContent='SUCCESS';b.classList.add('success')});
</script>
